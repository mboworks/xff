#
# pre-commit configuration (https://pre-commit.com). Mirrors mboworks/mbo's set,
# trimmed to what xff uses. Install once with `pre-commit install`; run over the
# whole tree with `pre-commit run -a`. clang-tidy runs here too (the local-only
# `clang-tidy` hook, via tools/clang_tidy.sh using the hermetic clang-22); the
# broader linters live in trunk (.trunk/trunk.yaml). clang-format here is pinned to v22.1.8 to match the
# hermetic toolchain clang-format (tools/clang_format.sh)
# byte-for-byte; keep this pin in lockstep with the LLVM toolchain version. A
# mismatch surfaces loudly as a CI clang-format failure rather than silent
# reformatting churn. This file owns clang-format, shell, YAML, workflow and
# repo-policy text checks.
#
# Pin the Python that pre-commit builds its managed hook environments with to 3.13
# (the version CI runs via actions/setup-python), so a contributor whose default
# `python3` is older does not silently validate against an ancient interpreter.
default_language_version:
  python: python3.13
# Run the policy/format gate on changed files before both commits and pushes. The push stage prevents
# a locally committed but unchecked change from reaching the remote; CI remains the all-files backstop.
default_stages: [pre-commit, pre-push]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
      # BINARY_TYPES below: archive containers are binary but can START with text (a phar begins with
      # PHP source), so pre-commit's content sniff calls them text and these two hooks "fix" a
      # trailing newline INSIDE the container, corrupting it silently. It happened to the phar
      # fixtures. Excluded by TYPE, not by location, so it holds wherever such a file is added.
      - id: end-of-file-fixer
        exclude: \.(phar|tar|tgz|gz|bz2|xz|zst|br|zip|jar|war|ear|apk|aab|whl|egg|nupkg|vsix|xpi|crx|jmod|deb|rpm|gem|crate|asar|7z)$
      - id: trailing-whitespace
        exclude: \.(phar|tar|tgz|gz|bz2|xz|zst|br|zip|jar|war|ear|apk|aab|whl|egg|nupkg|vsix|xpi|crx|jmod|deb|rpm|gem|crate|asar|7z)$

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
        name: Lint GitHub Actions workflow files
        description: Runs actionlint to lint GitHub Actions workflow files
        language: golang
        types: ["yaml"]
        files: ^\.github/workflows/
        entry: actionlint
        args: ["-shellcheck", ""]

  - repo: local
    hooks:
      - id: no-do-not-merge
        name: No 'DO NOT MERGE'
        description: |
          Add 'DONOTMERGE', 'DONOTSUBMIT', 'DO NOT MERGE', 'DO NOT SUBMIT', "DON'T MERGE",
          "DON'T SUBMIT" (or the underscore forms) to block merging. To skip this hook once,
          run `SKIP="no-do-not-merge" pre-commit`.
        language: pygrep
        args: [-i]
        entry: DO([ _]?NOT|N'T)[ _]?(SUBMIT|MERGE)
        exclude: ^\.pre-commit-config\.yaml$|\.(phar|tar|tgz|gz|bz2|xz|zst|br|zip|jar|war|ear|apk|aab|whl|egg|nupkg|vsix|xpi|crx|jmod|deb|rpm|gem|crate|asar|7z)$
        types: [text]
      - id: no-em-dashes
        name: No em-dashes
        description: |
          Project convention: never an em-dash (U+2014) anywhere (prose, docs, comments,
          commit messages). Use a spaced hyphen instead.
        language: pygrep
        entry: "—"
        exclude: ^\.pre-commit-config\.yaml$|\.(phar|tar|tgz|gz|bz2|xz|zst|br|zip|jar|war|ear|apk|aab|whl|egg|nupkg|vsix|xpi|crx|jmod|deb|rpm|gem|crate|asar|7z)$
        types: [text]
      - id: no-libarchive-filter-all
        name: Libarchive read filters use the explicit allowlist
        description: |
          The archive extra must never use archive_read_support_filter_all(): it can invoke host
          programs and would silently absorb future filters owned by removable extras.
        language: pygrep
        entry: \barchive_read_support_filter_all\s*\(
        files: ^extra_modules/archive/.*\.(cc|h)$
        types_or: [c, c++]
      - id: check-raw-pointers
        name: Xff-owned C++ interfaces use explicit object relationships
        description: |
          Scans every core and extension C++ source, including implementation-only interfaces.
          Required observers use references, optional observers use OptionalRef, and ownership
          uses values or smart pointers. Genuine ABI object pointers require a local reason.
        language: python
        entry: tools/check_raw_pointers.py
        pass_filenames: false
        files: ^(xff|xff_extras_api|extra_modules)/.*\.(cc|h)$
      - id: check-host-io
        name: Xff production code uses approved host file I/O
        description: Rejects unannotated host-file APIs outside the VFS and explicit adapters.
        language: python
        entry: tools/check_host_io.py
        types_or: [c, c++]
        files: ^(xff|xff_extras_api|extra_modules)/.*\.(cc|h)$
      - id: check-raw-pointers-test
        name: Test raw-pointer policy checker
        language: python
        entry: tools/check_raw_pointers_test.py
        pass_filenames: false
        files: ^tools/check_raw_pointers(_test)?\.py$
      - id: clang-tidy-targets-match-tag
        name: Manual clang-tidy targets are indexed
        description: |
          Manual targets tagged `clang-tidy` must be named explicitly in the compile-database target;
          aquery removes them before a wildcard or tag filter can discover them.
        language: script
        entry: tools/check_clang_tidy_targets.sh
        pass_filenames: false
        files: ^(.*/BUILD\.bazel|bazelmod/clang_tidy_targets\.bzl)$
      - id: cache-size-test
        name: Test GitHub Actions cache-size enforcement
        language: python
        entry: tools/cache_size_test.py
        pass_filenames: false
        files: ^(tools/cache_size(_test)?\.py|[.]github/workflows/cache_size[.]yml)$
      - id: no-todos-without-context
        name: No TODOs without context
        description: |
          Use referenceable TODOs: `// TODO(user@helly25.com)` or
          `# FIXME(https://github.com/mboworks/xff/issues/42)`. A bare TODO/FIXME with no
          email or URL is unmaintainable. To skip once, run
          `SKIP="no-todos-without-context" pre-commit`.
        language: pygrep
        args: [-i]
        exclude: ^[.]pre-commit-config\.yaml$|\.(phar|tar|tgz|gz|bz2|xz|zst|br|zip|jar|war|ear|apk|aab|whl|egg|nupkg|vsix|xpi|crx|jmod|deb|rpm|gem|crate|asar|7z)$
        entry: (#|//|/[*]).*(FIXME|TODO)[(](?!(((\w|\w[.-]\w)+@(\w|-)+([.](\w|-)+)*)|(https?://[^)]+))(,[^)]+)?)[)]
        types: [text]
      - id: no-hand-rolled-status-propagation
        name: No hand-written status propagation
        description: |
          Project convention (STYLE_CPP.md): propagate with the MBO status macros
          (MBO_ASSIGN_OR_RETURN / MBO_RETURN_IF_ERROR / MBO_MOVE_TO_OR_RETURN), never a
          hand-written `if (!x.ok()) { return x.status(); }`. Matches only that two-line shape, so
          a legitimate `return f().status();` (converting a StatusOr call into a Status return) and
          a recovery branch that inspects `.ok()` without propagating are both untouched. A
          bool-returning function is the documented exception and cannot match either, since it
          returns `false`. To skip once, run `SKIP="no-hand-rolled-status-propagation" pre-commit`.
        language: pygrep
        args: [--multiline]
        entry: 'if \(![\w.()]+\.ok\(\)\) \{\s*\n\s*return [\w.()]+\.status\(\);'
        files: \.(cc|h)$
      - id: no-braced-init-list-loop
        name: No range-for over an inline braced-init-list
        description: |
          Project convention (STYLE_CPP.md): iterate a NAMED `constexpr std::array` built with
          `std::to_array<T>({...})`, never an inline `for (x : {a, b, c})`. The named form says
          what the set IS, is greppable, and can be shared by a second case instead of copied.
          To skip once, run `SKIP="no-braced-init-list-loop" pre-commit`.
        language: pygrep
        entry: 'for\s*\([^)]*:\s*\{'
        files: \.(cc|h)$
      - id: check-namespace-style
        name: Global namespaces are owned and explicitly rooted
        description: |
          Project convention (STYLE_CPP.md): project code never declares or reopens a namespace
          named std or imports all of ::std. Using-declarations and namespace aliases targeting
          globally owned namespaces use a leading ::.
        language: script
        entry: tools/check_namespace_style.py
        files: \.(cc|h)$
      - id: check-namespace-style-test
        name: Test the namespace-style check
        language: script
        entry: tools/check_namespace_style_test.py
        files: ^tools/check_namespace_style(_test)?\.py$
        pass_filenames: false
      - id: no-shell-grep-in-bashtests
        name: No hand-rolled grep in bashtests
        description: |
          Project convention (STYLE_CPP.md): a bashtest asserts on captured output with
          mboworks/bashtest content matchers (expect_output_contains / expect_matches),
          never a hand-rolled shell `grep` - a piped `grep -q` misfires on SIGPIPE under
          `set -o pipefail`, and `$(grep -q ... && echo yes)` drops the output on failure.
          To skip once, run `SKIP="no-shell-grep-in-bashtests" pre-commit`.
        language: script
        entry: tools/check_bashtest_grep.sh
        files: _test\.sh$
      - id: managed-tmpdirs-in-bashtests
        name: Managed temporary directories in bashtests
        description: |
          Project convention (STYLE_SH.md): allocate bashtest scratch directories with
          `test_tmpdir`, so bashtest owns uniqueness, retention, and cleanup. The standalone
          release-prep test is excluded because it deliberately does not use mboworks_bashtest.
          To skip once, run `SKIP="managed-tmpdirs-in-bashtests" pre-commit`.
        language: script
        entry: tools/check_bashtest_tmpdirs.sh
        files: _test\.sh$
        exclude: ^tools/release_prep_test\.sh$
      - id: no-comparison-macros-in-cc-tests
        name: No GoogleTest comparison macros in C++
        description: |
          STYLE_CPP.md strictly forbids (ASSERT|EXPECT)_(EQ|NE|LT|LE|GT|GE|STREQ|STRNE|
          STRCASEEQ|STRCASENE|FLOAT_EQ|DOUBLE_EQ|NEAR). Use EXPECT_THAT / ASSERT_THAT with a
          matcher. TRUE / FALSE remain allowed because they assert boolean conditions rather than
          perform comparisons. The rule applies to every C++ file and has no exceptions.
        language: script
        entry: tools/check_test_matchers.sh
        types_or: [c, c++]
      - id: no-comparison-in-check-macro
        name: No comparison inside a boolean CHECK
        description: |
          Project convention (STYLE_CPP.md): a CHECK over a comparison uses the comparing macro -
          CHECK_NE(ptr, nullptr), CHECK_EQ(size, want) - because that form prints BOTH operands
          when it fires. CHECK(ptr != nullptr) prints only the expression's source text, so a
          crash report says what was compared but never what the values were. To skip once, run
          `SKIP="no-comparison-in-check-macro" pre-commit`.
        language: script
        entry: tools/check_check_macros.sh
        files: \.(cc|h)$
      - id: no-isok-assert-then-deref
        name: No ASSERT_THAT(x, IsOk()) followed by dereferencing x
        description: |
          Project convention (STYLE_CPP.md): asserting a StatusOr OK and then dereferencing it
          (*x / x->) splits one fact over two statements. MBO_ASSERT_OK_AND_ASSIGN binds the
          value in one step; IsOkAndHolds(m) says it in a single matcher when the value is only
          inspected once. ASSERT_THAT on a plain Status, or on a StatusOr never dereferenced,
          stays legal. To skip once, run `SKIP="no-isok-assert-then-deref" pre-commit`.
        language: script
        entry: tools/check_status_assert.py
        files: _test\.cc$
      - id: align-markdown-tables
        name: Align Markdown tables
        description: |
          Project convention (AGENTS.md): GitHub-flavored Markdown tables are kept
          vertically aligned (the pipes line up). This formatter pads each column to
          its widest cell, honoring the delimiter alignment markers, and rewrites the
          file in place. To skip once, run `SKIP="align-markdown-tables" pre-commit`.
        language: script
        entry: tools/align_markdown_tables.py
        types: [markdown]
      - id: align-markdown-tables-test
        name: Test the Markdown table aligner
        description: Runs the table-aligner unit tests when the tool or its test changes.
        language: script
        entry: tools/align_markdown_tables_test.py
        files: ^tools/align_markdown_tables(_test)?\.py$
        pass_filenames: false
      - id: generate-mime-db-test
        name: Test MIME database generation
        description: Verifies deterministic extension-conflict resolution for the removable mime-db extra.
        language: script
        entry: tools/generate_mime_db_test.py
        files: ^tools/generate_mime_db(_test)?\.py$
        pass_filenames: false
      - id: check-module-versions
        name: Modules share one version
        description: |
          The git tag is the version source of truth; the repo stays at the 0.0.0
          sentinel and the release workflow stamps the tag's version everywhere. This
          asserts every in-repo MODULE.bazel version, every intra-repo bazel_dep on one
          of our modules, and the `xff --version` literal already agree, so the stamp
          has one uniform value to replace and nothing ships a stale version.
        language: script
        entry: tools/check_module_versions.py
        files: ((^|/)MODULE\.bazel|^xff/cli/main\.cc|^tools/check_module_versions\.py)$
        pass_filenames: false
      - id: check-copyright
        name: Copyright identity is canonical repository-wide
        description: |
          LICENSE and every SPDX-FileCopyrightText declaration use the project's canonical year and
          holder. The check scans every tracked file, so a stale header cannot hide in a file outside
          the current commit. To skip once, run `SKIP="check-copyright" pre-commit`.
        language: script
        entry: tools/check_copyright.py
        pass_filenames: false
      - id: check-copyright-test
        name: Test the copyright identity check
        description: Runs the copyright-check unit tests when the tool or its test changes.
        language: script
        entry: tools/check_copyright_test.py
        files: ^tools/check_copyright(_test)?\.py$
        pass_filenames: false
      - id: check-module-versions-test
        name: Test the module-version check
        description: Runs the version-check unit tests when the tool or its test changes.
        language: script
        entry: tools/check_module_versions_test.py
        files: ^tools/check_module_versions(_test)?\.py$
        pass_filenames: false
      - id: check-docs-extras
        name: The docs config enables every extra
        description: |
          XFF.md is generated under --config=xff_docs so it documents the whole tool. That config
          lists the extras by hand, and forgetting one is SILENT - no build breaks, the published
          reference is just missing a feature. This asserts every `bool_flag` in xff/BUILD.bazel is
          enabled by that config (following --config= inheritance), with an allowlist in the tool for
          flags that are not extras. To skip once, run `SKIP="check-docs-extras" pre-commit`.
        language: script
        entry: tools/check_docs_extras.py
        files: ^(\.bazelrc|xff/BUILD\.bazel|tools/check_docs_extras\.py)$
        pass_filenames: false
      - id: check-docs-extras-test
        name: Test the docs-extras check
        description: Runs the docs-extras unit tests when the tool or its test changes.
        language: script
        entry: tools/check_docs_extras_test.py
        files: ^tools/check_docs_extras(_test)?\.py$
        pass_filenames: false
      - id: no-raw-rules-cc-load
        name: cc_* rules come from //xff:cc.bzl
        description: |
          Project convention: cc_library / cc_binary / cc_test are declared through the
          wrappers in xff/cc.bzl, never loaded from @rules_cc//cc:defs.bzl directly. The
          wrappers make every executable MSan-ready (they add the runtime suppression file
          to `data` under --config=msan and tag the target `msan`), so a target that
          bypasses them silently loses that. EXEMPT: extra_modules/** and
          xff_extras_api/** are separate bazel modules that must not depend on the core,
          so they cannot load a //xff label. To skip once, run
          `SKIP="no-raw-rules-cc-load" pre-commit`.
        language: pygrep
        entry: 'load\("@rules_cc//cc:defs\.bzl"[^)]*"cc_(binary|library|test)"'
        files: (^|/)BUILD(\.bazel)?$
        exclude: ^(extra_modules|xff_extras_api|third_party)/
      - id: check-bazel-policy
        name: Bazel packages are private and headers are checked
        description: |
          Every BUILD package defaults to private visibility, so cross-package APIs must opt in at
          their target. Both target and exec C++ compilation enable layering_check and parse_headers.
          The repository check covers existing files and makes new packages fail closed.
        language: script
        entry: tools/check_bazel_policy.py
        files: (^|/)(BUILD(\.bazel)?|\.bazelrc)$|^tools/check_bazel_policy\.py$
        pass_filenames: false
      - id: check-bazel-policy-test
        name: Test the Bazel policy check
        language: script
        entry: tools/check_bazel_policy_test.py
        files: ^tools/check_bazel_policy(_test)?\.py$
        pass_filenames: false
      - id: check-cc-target-naming
        name: cc_library targets end in _cc
        description: |
          Project convention (STYLE_CPP.md): a C++ library target is named `<thing>_cc`
          (glob_cc, license_cc, vfs_cc), so a label reads as "the C++ library for <thing>"
          and never collides with the directory, header or binary of the same name. Tests
          keep their `_test` suffix and are not checked. To skip once, run
          `SKIP="check-cc-target-naming" pre-commit`.
        language: script
        entry: tools/check_cc_target_naming.py
        files: (^|/)BUILD(\.bazel)?$
      - id: check-cc-target-naming-test
        name: Test the cc_library naming check
        description: |
          Runs the naming-check unit tests when the tool, its test, or the shared BUILD
          reader it is built on (tools/build_rules.py) changes.
        language: script
        entry: tools/check_cc_target_naming_test.py
        files: ^tools/(check_cc_target_naming(_test)?|build_rules)\.py$
        pass_filenames: false
      - id: check-env-documented
        name: Every environment variable xff reads is documented
        description: |
          Project rule (self-documenting features): `--help=environment` promises to list the
          variables xff reads, so a new `env::Get("NAME")` needs a row in the kVars table in
          xff/cli/help_build.cc - and a documented name nothing reads is a stale promise.
          Both directions fail. To skip once, run `SKIP="check-env-documented" pre-commit`.
        language: script
        entry: tools/check_env_documented.py
        # The trigger mirrors what the tool reads: production sources under the three module roots,
        # never a *_test.cc (a test may name any variable it likes, and the tool skips them), so a
        # test-only edit does not schedule a run that then ignores it.
        files: ^(xff|xff_extras_api|extra_modules)/.*\.(cc|h)$
        exclude: _test\.cc$
        pass_filenames: false
      - id: check-cc-library-tested
        name: Every cc_library has a test
        description: |
          Project rule (STYLE_CPP.md): all exported code is tested, at every level. This
          fails on a `cc_library` that no `*_test` rule in its own package depends on -
          transitive coverage and non-test dependents (a cc_binary, a bashtest) do not
          count. A library with genuinely no testable surface goes in the tool's
          _ALLOWLIST together with the reason. To skip once, run
          `SKIP="check-cc-library-tested" pre-commit`.
        language: script
        entry: tools/check_cc_library_tested.py
        files: (^|/)BUILD(\.bazel)?$
      - id: check-cc-library-tested-test
        name: Test the library-has-a-test check
        description: |
          Runs the coverage-check unit tests when the tool, its test, or the shared BUILD
          reader it is built on (tools/build_rules.py) changes.
        language: script
        entry: tools/check_cc_library_tested_test.py
        files: ^tools/(check_cc_library_tested(_test)?|build_rules)\.py$
        pass_filenames: false
      - id: build-rules-test
        name: Test the shared BUILD reader
        description: Runs the BUILD-reader unit tests when it or its test changes.
        language: script
        entry: tools/build_rules_test.py
        files: ^tools/build_rules(_test)?\.py$
        pass_filenames: false
      - id: fix-compile-commands-test
        name: Test the compile-database post-processor
        description: |
          Runs the compile_commands.json post-processor's unit tests (local-module source-path
          remapping, macOS SDK libc++ flag stripping) when it or its test changes. The remapping
          is what makes clang-tidy / clangd see the composable extras at all, and it fails
          OPEN - a broken remap looks like clean code rather than an error - so it is tested.
        language: script
        entry: tools/fix_compile_commands_test.py
        files: ^tools/fix_compile_commands(_test)?\.py$
        pass_filenames: false
      - id: extras-derivation-test
        name: Test the extras derivation
        description: |
          Runs the extras-derivation unit tests when the tool or its test changes. Both CI (via
          tools/extras.py) and //:refresh_compile_commands (via tools/extras_repo.bzl) derive the
          set of composable extras from MODULE.bazel, because an extra missing from either is
          SILENTLY uncovered: `//...` does not match another bazel module.
        language: script
        entry: tools/extras_test.py
        files: ^tools/extras(_test)?\.py$
        pass_filenames: false
      - id: fuzz-targets-test
        name: Test fuzz campaign discovery and budgets
        description: |
          Runs the fuzz-driver unit tests when its implementation or either CI campaign policy
          changes, so target growth cannot silently exceed the required or deep-fuzz budget.
        language: script
        entry: tools/fuzz_targets_test.py
        files: ^(\.github/workflows/(fuzz|main)\.yml|tools/fuzz_targets(_test)?\.py)$
        pass_filenames: false
      - id: release-prep-test
        name: Test the release prep script
        description: |
          Runs the release_prep unit test (CHANGELOG guard, version stamping,
          consistency check, release-notes output, Clang reference generation)
          when the release script, workflow, test, or version check changes.
        language: script
        entry: tools/release_prep_test.sh
        files: ^(\.github/workflows/release\.yml|tools/(release_prep\.sh|release_prep_test\.sh|check_module_versions\.py))$
        pass_filenames: false
      - id: trigger-release-test
        name: Test the release trigger next-version logic
        description: |
          Runs the trigger_release unit test (next-version default minor bump,
          explicit override, strictly-greater X.Y.Z check) when the trigger
          script or its test changes.
        language: script
        entry: tools/trigger_release_test.sh
        files: ^tools/(trigger_release\.sh|trigger_release_test\.sh)$
        pass_filenames: false
      - id: clang-tidy
        name: clang-tidy (opt-in locally; gated by the CI clang-tidy job)
        description: |
          Runs clang-tidy over the given C++ sources via tools/clang_tidy.sh, a report-only
          pass (no --fix, so it never rewrites the tree). It needs a compile_commands.json (a
          gitignored local artifact; build it with ./compile_commands-update.sh) and a hermetic
          clang-tidy (>= clang-22 for this C++23 codebase); it SKIPS cleanly when either is
          missing, so it never forces the toolchain download on a fresh checkout.
          `stages: [manual]` keeps it off the local commit hook (run it explicitly with
          `pre-commit run clang-tidy --all-files --hook-stage manual`), but the dedicated CI
          `clang-tidy` job owns it as a HARD GATE: that job builds the compile DB and invokes this
          same script directly so per-file progress streams live, and `.clang-tidy` is
          `WarningsAsErrors: '*'`, so any
          finding fails CI. It is not run by trunk (trunk pinned clang-tidy 16, which mis-parses
          C++23 - do not re-add it there).
        language: script
        entry: tools/clang_tidy.sh
        types: [file]
        files: (\.(cc|cpp|cxx|h|hh|hpp|hxx|inc|ipp|bzl)$|\.h\.in$)
      - id: clang-tidy-scope-test
        name: Test clang-tidy orchestration
        language: system
        entry: python3 -m unittest tools/clang_tidy_compdb_test.py tools/clang_tidy_scope_test.py tools/clang_tidy_runner_test.py
        files: ^tools/clang_tidy_(compdb|scope|runner)(_test)?\.py$
        pass_filenames: false
        # Skip the composable build extras (extra_modules/<name>): each is a flag-gated optional
        # local module whose external deps (e.g. pcre2.h) are absent from a lean build, so the core
        # clang-tidy gate cannot parse them. They get linted under their own build config, not here.
        stages: [manual]
      - id: host-io-policy-test
        name: Test host-I/O policy checker
        language: python
        entry: python3 -m unittest tools.check_host_io_test
        pass_filenames: false
        files: ^tools/check_host_io(_test)?\.py$

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        types_or: [c, c++, cuda]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.11.0-1
    hooks:
      - id: shfmt
        args: ["-bn", "-ci", "-i=2", "-w"]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
