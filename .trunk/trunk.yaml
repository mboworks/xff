# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.10.2
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  definitions:
    - name: buildifier
      files: [starlark, bazel-build, bazel-workspace]
      tools: [buildifier]
      commands:
        - name: fix
          run: buildifier --lint=fix "${target}"
          output: rewrite
          cache_results: true
          formatter: true
          in_place: true
          batch: true
          success_codes: [0]
        - name: warn
          run: buildifier --lint=warn --format=json --mode=check "${target}"
          # Custom parser type defined in the trunk cli to handle buildifier's JSON output.
          output: buildifier
          cache_results: true
          batch: true
          success_codes: [0]
      suggest_if: files_present
      direct_configs:
        - .buildifier.json
        # Not a native buildifier construct, but useful for 'addTables', see test file
        - .buildifier-tables.json
      environment:
        - name: PATH
          list: ["${linter}"]
      known_good_version: 7.1.0
      version_command:
        parse_regex: ${semver}
        run: buildifier --version
  enabled:
    - buildifier@8.5.1
    - checkov@3.3.1
    - git-diff-check
    - markdownlint@0.49.0
    - prettier@3.8.4
    - trivy@0.70.0
    - trufflehog@3.95.3
    - yamllint@1.38.0
  ignore:
    # XFF.md is generated (verbatim `xff_full --markdown`, guarded by //xff/cli:xff_markdown_test),
    # not hand-authored prose. NO linter/formatter may touch it: markdownlint would flag the
    # renderer's style (MD049 emphasis, MD024 repeated headings like Time under Options and Fields),
    # and prettier would reformat it (blank lines around headings), both of which would make the
    # committed file diverge from the binary output and break the diff_test - its sole gate.
    - linters: [ALL]
      paths:
        - XFF.md
actions:
  definitions:
    - id: xff-clang-tidy-pre-commit
      description: Run the changed-file clang-tidy pre-commit hook
      run: pre-commit run clang-tidy --hook-stage pre-commit
      interactive: optional
      triggers:
        - git_hooks: [pre-commit]
    - id: xff-clang-tidy-pre-push
      description: Run clang-tidy once for files changed by the pushed refs
      run: python3 tools/clang_tidy_pre_push.py '${hook_stdin_path}'
      interactive: optional
      triggers:
        - git_hooks: [pre-push]
  enabled:
    - xff-clang-tidy-pre-commit
    - xff-clang-tidy-pre-push
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
