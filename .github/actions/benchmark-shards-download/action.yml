name: Download benchmark measurement shards
description: Select each shard by creation time, verify its digest, and retain exact JSON payloads
inputs:
  platform:
    description: Benchmark platform (linux or macos)
    required: true
runs:
  using: composite
  steps:
    # download-artifact deduplicates by highest ID, even before explicit ID filtering.
    # Retried artifacts can have lower IDs, so use creation time and exact REST downloads.
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BENCHMARK_PLATFORM: ${{ inputs.platform }}
      run: |
        set -euo pipefail
        case "${BENCHMARK_PLATFORM}" in
          linux | macos) ;;
          *) echo "Unsupported benchmark platform: ${BENCHMARK_PLATFORM}" >&2; exit 1 ;;
        esac
        gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
          --paginate | jq --arg platform "${BENCHMARK_PLATFORM}" -sr '[.[].artifacts[] | select(.expired == false) | select(.name | test("^benchmark-shard-\($platform)-[0-9]+$"))] | group_by(.name) | map(max_by(.created_at, .id)) | .[] | [.name, .id, .digest] | @tsv' > benchmark-shard-artifacts.tsv
        test -s benchmark-shard-artifacts.tsv
        while IFS=$'\t' read -r name id digest; do
          echo "Downloading ${name}, artifact ${id}"
          archive="${RUNNER_TEMP}/${name}.zip"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" >"${archive}"
          test "${digest#sha256:}" != "${digest}"
          printf '%s  %s\n' "${digest#sha256:}" "${archive}" | shasum -a 256 --check --status
          mkdir -p "shards/${name}"
          unzip -p "${archive}" benchmark-shard.json >"shards/${name}/benchmark-shard.json"
        done < benchmark-shard-artifacts.tsv
