name: Publish benchmarks

on:
  workflow_run:
    workflows: [Test, Benchmarks, Release, Benchmark backfill]
    types: [in_progress, completed]
  workflow_dispatch: {}

permissions: {}

jobs:
  preview:
    if: >-
      github.event_name == 'workflow_run' && github.event.action == 'in_progress' &&
      github.event.workflow_run.name == 'Test' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 125
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      available: ${{ steps.wait.outputs.available }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      # Waiting consumes no deployment lock and executes no incoming PR code.
      - name: Wait for benchmark comparisons, independently of the other Test jobs
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          python3 tools/benchmark_preview_ci.py wait --repository="${GITHUB_REPOSITORY}" \
            --run="${SOURCE_RUN}" --attempt="${SOURCE_ATTEMPT}" --output="${GITHUB_OUTPUT}"

  publish:
    needs: [preview]
    if: >-
      always() && !cancelled() && (needs.preview.outputs.available == 'true' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.name == 'Release' ||
      (github.event.workflow_run.head_branch == 'main' &&
      ((github.event.workflow_run.name == 'Benchmarks' && github.event.workflow_run.event == 'push') ||
      (github.event.workflow_run.name == 'Benchmark backfill' && github.event.workflow_run.event == 'workflow_dispatch'))))))
    concurrency:
      group: coverage-pages
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Only trusted publisher code executes; incoming benchmark artifacts are JSON data.
      - uses: actions/checkout@v7
        with:
          ref: main
          path: source
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          ref: coverage-pages
          path: site
      - name: Expand retained benchmark inputs
        run: python3 source/tools/site_storage.py expand-benchmarks site/benchmarks
      - name: Verify and retain current PR benchmark JSON
        if: needs.preview.outputs.available == 'true'
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          python3 source/tools/benchmark_preview_ci.py collect --repository="${GITHUB_REPOSITORY}" \
            --run="${SOURCE_RUN}" --attempt="${SOURCE_ATTEMPT}" --root=site/benchmarks \
            --output="${GITHUB_OUTPUT}"
      - uses: actions/download-artifact@v8
        if: github.event.workflow_run.name == 'Benchmarks'
        with:
          github-token: ${{ github.token }}
          pattern: benchmark-report*
          path: report
          run-id: ${{ github.event.workflow_run.id }}
      - name: Retain incoming benchmark measurements
        if: github.event.workflow_run.name == 'Benchmarks'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}" > source-run.json
          commit="$(jq -r .head_sha source-run.json)"
          reference="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${commit}" --jq .commit.committer.date)"
          jq --arg reference "${reference}" '. + {reference_time: $reference}' source-run.json > source-reference.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls?state=all&per_page=100" > pulls.json
          for report in report/*/benchmark-report*.json; do
            python3 source/tools/benchmark_history.py publish \
              --root=site/benchmarks --report="${report}" \
              --source=source-reference.json --pulls=pulls.json --repository="${GITHUB_REPOSITORY}"
          done
      - uses: actions/download-artifact@v8
        if: github.event.workflow_run.name == 'Benchmark backfill'
        with:
          github-token: ${{ github.token }}
          pattern: benchmark-backfill-*
          path: backfill
          run-id: ${{ github.event.workflow_run.id }}
      - name: Validate and retain the complete CI backfill campaign
        if: github.event.workflow_run.name == 'Benchmark backfill'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}" > source-run.json
          python3 source/tools/benchmark_campaign.py publish \
            --root=site/benchmarks --artifacts=backfill --source=source-run.json \
            --repository="${GITHUB_REPOSITORY}"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Build pinned benchmark renderer
        working-directory: source/tools/benchmark_web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Refresh stable benchmark references and deploy
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW: ${{ needs.preview.outputs.available }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls?state=all&per_page=100" > pulls.json
          incremental=()
          if [ "${PREVIEW}" = 'true' ]; then
            incremental+=(--incremental-previews)
          else
            python3 source/tools/benchmark_history.py refresh \
              --root=site/benchmarks --pulls=pulls.json --checkout=source --repository="${GITHUB_REPOSITORY}"
          fi
          python3 source/tools/benchmark_landscape.py --site-root=site/benchmarks \
            --renderer-js=source/tools/benchmark_web/dist/landscape.js --pulls=pulls.json \
            --repository="${GITHUB_REPOSITORY}" "${incremental[@]}"
          python3 source/tools/site_artwork.py source/docs/assets site
          python3 source/tools/compact_site.py site
          git -C site config user.name 'github-actions[bot]'
          git -C site config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C site add --all
          if ! git -C site diff --cached --quiet; then
            git -C site commit -m 'benchmarks: publish paired measurements'
            git -C site push
          fi
          mkdir -p public
          rsync --archive --exclude='.git' site/ public/
          python3 source/tools/site_artwork.py source/docs/assets public
          python3 source/tools/compact_site.py public
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - uses: actions/deploy-pages@v5
        id: deployment
      - name: Verify live benchmark publication
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 source/tools/verify_benchmark_publication.py \
            --index=public/benchmarks/index.html --url="${PAGE_URL}benchmarks/index.html"
      - name: Update the current PR benchmark overview after publication
        if: steps.preview.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          python3 source/tools/site_storage.py expand-benchmarks site/benchmarks/previews
          python3 source/tools/benchmark_preview_ci.py comment --repository="${GITHUB_REPOSITORY}" \
            --run="${SOURCE_RUN}" --attempt="${SOURCE_ATTEMPT}" --root=site/benchmarks \
            --site-url="${PAGE_URL}benchmarks/"
