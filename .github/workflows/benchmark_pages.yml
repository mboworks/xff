name: Publish benchmarks

on:
  workflow_run:
    workflows: [Test, Benchmarks, Release, Benchmark backfill]
    types: [completed]
  workflow_dispatch: {}
  schedule:
    - cron: "17 */6 * * *"

# One running publisher and only the newest pending request. The pending request
# reconciles every available source, including work from displaced requests.
concurrency:
  group: benchmark-publication-latest
  queue: single
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    # Every request reconciles all trusted sources. A request which replaces a
    # pending one must never be skipped based on its own triggering event.
    # Other retained-site writers use this lock too. Never cancel those writers.
    concurrency:
      group: coverage-pages
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          path: source
          fetch-depth: 0
          filter: blob:none
      - uses: actions/checkout@v7
        with:
          ref: coverage-pages
          path: site
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Build pinned benchmark renderer
        working-directory: source/tools/benchmark_web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Reconcile and retain available benchmarks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -C site config user.name 'github-actions[bot]'
          git -C site config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          refresh_site() {
            python3 source/tools/site_storage.py expand-benchmarks site/benchmarks
            python3 source/tools/benchmark_reconcile_ci.py \
              --repository="${GITHUB_REPOSITORY}" --root=site/benchmarks
            gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls?state=all&per_page=100" > pulls.json
            python3 source/tools/benchmark_history.py refresh \
              --root=site/benchmarks --pulls=pulls.json --checkout=source --repository="${GITHUB_REPOSITORY}"
            python3 source/tools/benchmark_landscape.py --site-root=site/benchmarks \
              --renderer-js=source/tools/benchmark_web/dist/landscape.js --pulls=pulls.json \
              --repository="${GITHUB_REPOSITORY}"
            python3 source/tools/site_artwork.py source/docs/assets site
            python3 source/tools/compact_site.py site
            git -C site add --all
            if ! git -C site diff --cached --quiet; then
              git -C site commit -m 'benchmarks: reconcile available measurements'
            fi
          }
          refresh_site
          export -f refresh_site
          python3 source/tools/publish_site.py --repo=site -- \
            bash -c 'set -euo pipefail; refresh_site'
