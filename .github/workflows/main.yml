name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

# A branch push is covered by its pull_request run; only `main` needs a push
# run. Supersede stale PR runs, but let the RUNNING main validation finish: the
# coverage publisher is triggered only when this whole workflow completes, so
# cancelling every post-merge run during a sequence of merges can indefinitely
# prevent `coverage/main` from being refreshed. The concurrency group still
# keeps at most one newer main run pending, and the publisher's metadata ordering
# prevents an older completed report from replacing a newer one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: read-all

jobs:
  test:
    name: ${{ matrix.config.name == 'asan' && 'asan' || format('test ({0})', matrix.os) }}
    # Gate the heavy matrix behind the fast pre-flight checks (lint + the XFF.md drift guard), so a
    # stale reference or a lint failure fails in minutes instead of after the full asan build.
    needs: [pre-commit, trunk]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        config:
          - name: default
            flags: "--config=clang"
          - name: asan
            flags: "--config=clang --config=asan"
        exclude:
          # asan on Linux is enough; the macOS asan cell is redundant sanitizer coverage, so drop it.
          # This leaves: ubuntu default, ubuntu asan, macos default.
          - os: macos-latest
            config:
              name: asan
              flags: "--config=clang --config=asan"
    steps:
      - uses: actions/checkout@v7
      # bazelisk launches the Bazel release pinned in .bazelversion.
      - uses: bazelbuild/setup-bazelisk@v3
      # Persist Bazel's disk cache (compiled action outputs) so each run reuses prior
      # work instead of rebuilding from scratch. Keyed by os/config + the lockfile hash
      # only: a per-run github.sha suffix used to mint a fresh cache on every commit, so
      # caches were evicted before they could be reused. A stable key keeps one entry per
      # os/config/lockfile (the hash busts it when deps change); the restore-key seeds a
      # warm base from a previous lockfile after a bump.
      - name: Mount Bazel disk cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-${{ matrix.os }}-${{ matrix.config.name }}-${{ hashFiles('MODULE.bazel.lock', '.bazelversion') }}
          restore-keys: |
            bazel-disk-${{ matrix.os }}-${{ matrix.config.name }}-
      # Every matrix cell uses hermetic LLVM. Do not persist the repository cache: one LLVM archive
      # is ~4.4 GB and would consume almost half of GitHub's per-repository cache budget. Compiled
      # actions remain in the bounded disk cache above; LLVM itself re-fetches each run.
      # man_test renders `xff --man` through a roff formatter; it is a required test
      # dependency (no skip). macOS ships mandoc; install it on Linux.
      - name: Install roff formatter (mandoc)
        run: |
          if [ "${RUNNER_OS}" = "Linux" ]; then
            sudo apt-get install -y mandoc
          fi
          command -v mandoc
      # The FUSE server's integration test mounts a real filesystem through the kernel, which only
      # Linux runners can do (macOS has no fuse3; the test skips there by design). Install the
      # runtime pieces the loader dlopens (libfuse3) and the unmount helper (fusermount3). The test
      # command below opts Linux into the Bazel capability contract, so mounting failures cannot
      # silently become skips.
      - name: Enable FUSE integration coverage (Linux)
        run: |
          if [ "${RUNNER_OS}" = "Linux" ]; then
            sudo apt-get install -y fuse3 libfuse3-3
          fi
      # Every job builds with EVERY extra on (--config=xff_docs, which is --config=xff_full plus the
      # archive extra), so the composable extras get the SAME asan / tsan coverage as the core - our
      # PCRE2 C-API wrapper and the archive readers are exactly where a buffer / lifetime / thread bug
      # would hide, and the archive ones parse untrusted binary headers. It is also the only config in
      # which the archive-gated end-to-end tests (XFF_ARCHIVE_ONLY) exist at all.
      #
      # The full-only targets are picked up by `//...` automatically (target_compatible_with, no names
      # needed), but each extra is its own bazel MODULE and `//...` does NOT match another module - so
      # an extra whose wildcard is absent here has no coverage at all. That is not hypothetical:
      # @xff_archive was missing until 2026-08-11, which is how a PR merged green with four of its test
      # fixtures absent from the repo. The wildcards are therefore DERIVED from MODULE.bazel (the source
      # of truth for which extras exist) by tools/extras.py, so adding an extra needs no workflow edit.
      # An extra's own tests need no --//xff:xff_<extra> flag: that gates whether the CORE links the
      # extra, not whether the extra builds. Only the `minimal` job opts out. The lean `xff` binary
      # stays lean here (no extras select), so its tests still assert the extras are absent from it.
      - name: bazel test
        run: |
          fuse_test_config=()
          if [ "${RUNNER_OS}" = "Linux" ]; then
            fuse_test_config+=(--config=xff_fuse_tests_required)
          fi
          # shellcheck disable=SC2046  # deliberate word splitting: the tool prints bazel target patterns
          bazel test //... $(tools/extras.py --wildcards) --config=xff_docs \
            --disk_cache=$HOME/.cache/bazel-disk --repository_cache=$HOME/.cache/bazel-repo \
            "${fuse_test_config[@]}" \
            ${{ matrix.config.flags }}

  # GCC is a portability check for this leaf executable, not a second authoritative test matrix.
  # Build every core and extension target once on Linux; Clang + libc++ owns tests, sanitizers,
  # generated references, release binaries, and (after its separate migration) coverage.
  gcc:
    needs: [pre-commit, trunk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bazelbuild/setup-bazelisk@v3
      - name: Mount Bazel repo cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/bazel-repo
          key: bazel-repo-gcc-${{ hashFiles('MODULE.bazel.lock', '.bazelversion') }}
          restore-keys: |
            bazel-repo-gcc-
      - name: bazel build
        run: |
          # shellcheck disable=SC2046  # deliberate splitting: the tool prints Bazel target patterns
          bazel build //... $(tools/extras.py --wildcards) --config=xff_docs \
            --repository_cache=$HOME/.cache/bazel-repo

  # trunk (https://trunk.io) runs the heavier linters: buildifier, markdownlint,
  # prettier, yamllint, and the security scanners. (clang-tidy is a local-only
  # pre-commit hook now, not a trunk linter; CI relies on the bazel -Werror gate.)
  # Mirrors mboworks/mbo.
  trunk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trunk Check
        uses: trunk-io/trunk-action@v1

  # pre-commit hooks (clang-format, shfmt, shellcheck, actionlint, and the
  # repo-policy text checks incl. no-em-dashes). The local-only clang-tidy hook
  # self-skips here (no compile DB on the runner). Mirrors mboworks/mbo.
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: pre-commit/action@v3.0.1

  # Normal tests already replay every committed corpus. This parallel job does the materially
  # different work: sustained mutation under libFuzzer instrumentation. Its action keys do not
  # match the clang-ASan matrix, so it owns a size-bounded disk cache namespace instead of pretending
  # those jobs share compiled outputs. The multi-gigabyte hermetic LLVM repository is not cached.
  fuzz:
    needs: [pre-commit, trunk]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # Required CI stays bounded: ten targets at 60 seconds each is ten minutes of deliberate
    # mutation plus compilation. The weekly/manual Deep fuzz workflow owns longer campaigns, so a
    # merge does not hold the main validation and release path for at least fifty minutes.
    env:
      FUZZ_SECONDS_PER_TARGET: 60
    steps:
      - uses: actions/checkout@v7
      - uses: bazelbuild/setup-bazelisk@v3
      - name: Mount the dedicated fuzz disk cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-fuzz-${{ hashFiles('MODULE.bazel.lock', '.bazelversion') }}
          restore-keys: |
            bazel-disk-fuzz-
      - name: Run bounded fuzz campaigns
        run: |
          set -euo pipefail
          target_count="$(tools/fuzz_targets.py --list | wc -l)"
          {
            echo "### Bounded fuzz campaigns"
            echo
            echo "${target_count} targets, ${FUZZ_SECONDS_PER_TARGET} seconds per target"
          } >>"${GITHUB_STEP_SUMMARY}"
          tools/fuzz_targets.py \
            --campaign-seconds="${FUZZ_SECONDS_PER_TARGET}" \
            --max-total-seconds=900 \
            --disk-cache="${HOME}/.cache/bazel-disk" \
            --disk-cache-max-size=600M

  # Coverage follows the authoritative hermetic Clang/libc++ build. This is a production-code
  # gate, not merely another test cell: it publishes both the raw LCOV data and the policy-rendered
  # capability/extension report, and enforces changed-line coverage.
  coverage:
    needs: [pre-commit, trunk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: bazelbuild/setup-bazelisk@v3
      # Coverage instrumentation has distinct action keys, so keep its compiled outputs in a
      # dedicated cache rather than crowding out the ordinary Clang build. The stable key lets a
      # later run incrementally rebuild only changed coverage objects.
      - name: Mount Bazel coverage disk cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-coverage-${{ hashFiles('MODULE.bazel.lock', '.bazelversion') }}
          restore-keys: |
            bazel-disk-coverage-
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install coverage and integration-test dependencies
        run: |
          # Ubuntu's lcov package supplies the Perl dependencies, but its old genhtml ignores
          # metric-specific color thresholds. Install the pinned current release over it below.
          sudo apt-get install -y lcov mandoc fuse3 libfuse3-3
          tools/install_lcov.sh "${RUNNER_TEMP}/lcov"
          echo "${RUNNER_TEMP}/lcov/bin" >>"${GITHUB_PATH}"
      - name: Collect and enforce coverage
        # This does not enable the FUSE extension; --config=xff_docs enables every extension.
        # The Linux coverage runner installs fuse3 and can mount through the kernel, so a failed
        # mount must fail the integration test rather than silently turn into a skip.
        env:
          COVERAGE_PAGE: ${{ github.event_name == 'pull_request' && format('pr/{0}', github.event.pull_request.number) || 'main' }}
        run: |
          set -euo pipefail
          INSTRUMENTATION_FILTER="$(tools/extras.py --instrumentation-filter)"
          # shellcheck disable=SC2046  # deliberate splitting into Bazel target patterns
          bazel coverage //... $(tools/extras.py --wildcards) \
            --config=clang-coverage \
            --config=xff_docs \
            --config=xff_fuse_tests_required \
            --combined_report=lcov \
            --disk_cache=$HOME/.cache/bazel-disk \
            --instrumentation_filter="${INSTRUMENTATION_FILTER}"
          cp "$(bazel info output_path)/_coverage/_coverage_report.dat" coverage.lcov
          printf '%s\n' "${COVERAGE_PAGE}" >coverage-target.txt
          # Derive extension source paths from the same extras registry that supplies the Bazel
          # target wildcards, so adding a module cannot leave its HTML source view behind.
          python3 tools/coverage_sources.py coverage.lcov coverage-html.lcov \
            --policy coverage_policy.json \
            --source-root coverage-source-tree
          python3 tools/coverage_lcovrc.py coverage_policy.json coverage.lcovrc
          # LLVM can mark a hit line whose branches remain unevaluated. LCOV 2.5 calls these
          # inconsistent/corrupt; repeating the warning categories suppresses their expected
          # warning summaries.
          genhtml coverage-html.lcov \
            --branch-coverage \
            --config-file coverage.lcovrc \
            --demangle-cpp \
            --function-coverage \
            --ignore-errors corrupt,inconsistent,inconsistent,negative,unsupported,unsupported \
            --output-directory coverage-html/lcov \
            --prefix "${PWD}/coverage-source-tree" \
            --show-details \
            --title "xff production coverage"
          python3 tools/coverage_html.py coverage-html/lcov coverage_policy.json "${COVERAGE_PAGE}"
          python3 -m unittest tools/coverage_test.py tools/coverage_sources_test.py \
            tools/coverage_html_test.py tools/coverage_index_test.py tools/coverage_lcovrc_test.py \
            tools/coverage_policy_test.py
          BASE_ARGS=()
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            git fetch --quiet --no-tags origin main
            BASE_ARGS=(--base-ref origin/main)
          fi
          python3 tools/coverage.py \
            --lcov coverage.lcov \
            --json-summary coverage-html/coverage-summary.json \
            --policy coverage_policy.json \
            --summary coverage-summary.md \
            "${BASE_ARGS[@]}"
          python3 tools/coverage_index.py report \
            coverage-html/coverage-summary.json "${COVERAGE_PAGE}" coverage-html/index.html
          {
            echo "### Production coverage"
            echo
            echo "[Browse the HTML coverage report](https://mboworks.github.io/xff/coverage/${COVERAGE_PAGE}/)."
            echo
            echo "[Download this run's coverage artifact](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}#artifacts)."
            echo
            cat coverage-summary.md
          } >>"${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: |
            coverage-html/
            coverage.lcov
            coverage-summary.md
            coverage-target.txt
          retention-days: 14
          if-no-files-found: error

  # ThreadSanitizer for the parallel walk (issue #43; mutually exclusive with the
  # asan cell). ubuntu-only. Like the asan cell this uses --config=clang, which
  # downloads a ~4.4 GB hermetic LLVM: we deliberately do NOT cache that (it would
  # eat almost half of GitHub's 10 GB/repo limit and re-downloads quickly from the
  # LLVM release). Instead we cache the disk (instrumented compiled outputs), the
  # expensive recurring work that previously rebuilt from scratch every run; LLVM
  # re-fetches each run.
  tsan:
    needs: [pre-commit, trunk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bazelbuild/setup-bazelisk@v3
      - name: Mount Bazel disk cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-tsan-${{ hashFiles('MODULE.bazel.lock', '.bazelversion') }}
          restore-keys: |
            bazel-disk-tsan-
      - name: Install roff formatter (mandoc)
        run: sudo apt-get install -y mandoc
      # This runner promises a working mount path through the named Bazel config below.
      - name: Enable FUSE integration coverage
        run: |
          sudo apt-get install -y fuse3 libfuse3-3
      - name: bazel test
        run: |
          # shellcheck disable=SC2046  # deliberate word splitting: the tool prints bazel target patterns
          bazel test //... $(tools/extras.py --wildcards) --config=xff_docs \
            --disk_cache=$HOME/.cache/bazel-disk --config=clang --config=tsan \
            --config=xff_fuse_tests_required

  # MemorySanitizer: reads of UNINITIALIZED memory, which asan does not catch. Linux only
  # (MSan is effectively Linux/x86-64 Clang; there is no macOS support), so this is a single
  # ubuntu cell and never joins the macOS matrix.
  #
  # MSan false-positives on any code it did not instrument. Everything we link builds from
  # source under bazel, so --config=msan's -fsanitize=memory reaches it - EXCEPT the C++
  # standard library, which ships prebuilt (uninstrumented) in the hermetic LLVM. That one
  # exception is handled by the TOOLCHAIN: --config=msan turns on toolchains_llvm's `msan`
  # feature, which swaps in the instrumented libc++ overlay the `libcxx_url` attribute in
  # bazelmod/llvm.MODULE.bazel fetches. So this cell needs no extra build step and no
  # cmake/ninja - it is a plain `bazel test`, exactly like the tsan cell above.
  msan:
    needs: [pre-commit, trunk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bazelbuild/setup-bazelisk@v3
      - name: Mount Bazel disk cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-msan-${{ hashFiles('MODULE.bazel.lock', '.bazelversion') }}
          restore-keys: |
            bazel-disk-msan-
      - name: Install roff formatter (mandoc)
        run: sudo apt-get install -y mandoc
      # Installed for the same reason as the tsan cell, though every mounting test skips here: a
      # mount runs through the dlopened SYSTEM libfuse3, and MSan reports everything it did not
      # instrument as uninitialized. The skips key off --config=msan itself (the MEMORY_SANITIZER
      # macro in C++, the XFF_MSAN env in the shell test), so they hold whether or not this is set.
      - name: Enable FUSE integration coverage
        run: |
          sudo apt-get install -y fuse3 libfuse3-3
      - name: bazel test
        run: |
          # shellcheck disable=SC2046  # deliberate word splitting: the tool prints bazel target patterns
          bazel test //... $(tools/extras.py --wildcards) --config=xff_docs \
            --disk_cache=$HOME/.cache/bazel-disk --config=clang --config=msan \
            --config=xff_fuse_tests_required

  # Minimal core archive: prove that dropping the WHOLE extra_modules/ directory plus its one module
  # include still builds the lean core. This is the regression guard
  # for the "full separation" property (#123) - the shared xff_extras_api base module lives at the
  # top level (not under extra_modules/), and nothing in the core reaches into an extra, so a future
  # core->extra dependency would fail here. The sole job that opts OUT of the extras (every other job
  # runs --config=xff_full); one cell on the single most-default target (lean //xff/cli:xff, ubuntu).
  minimal:
    needs: [pre-commit, trunk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bazelbuild/setup-bazelisk@v3
      - name: Mount Bazel disk cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-minimal-${{ hashFiles('MODULE.bazel.lock', '.bazelversion') }}
          restore-keys: |
            bazel-disk-minimal-
      - name: Strip all extras (simulate a minimal core archive)
        run: |
          python3 - <<'PY'
          import pathlib
          root = pathlib.Path(".")
          text = (root / "MODULE.bazel").read_text()
          include = 'include("//bazelmod:extras.MODULE.bazel")\n'
          if text.count(include) != 1:
              raise SystemExit("expected exactly one extras module include")
          text = text.replace(include, "")
          (root / "MODULE.bazel").write_text(text)
          print("stripped extras module include")
          PY
          rm -rf extra_modules
          ! grep -q 'extras.MODULE.bazel' MODULE.bazel
      - name: bazel build (lean core, extras removed)
        run: bazel build //xff/cli:xff --config=clang --disk_cache=$HOME/.cache/bazel-disk

  # Fast pre-flight gate: XFF.md and NOTICE are committed references generated by xff_full, so
  # regenerate them and fail on any drift BEFORE the heavy build/test matrix runs. It
  # builds only xff_full + the diff_test (no asan/tsan, no full suite) and is disk-cache-only (like
  # tsan/minimal), so it is one of the cheap checks the matrix waits on, alongside pre-commit/trunk.
  xff-md:
    needs: [pre-commit, trunk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bazelbuild/setup-bazelisk@v3
      - name: Mount Bazel disk cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-xff-md-${{ hashFiles('MODULE.bazel.lock', '.bazelversion') }}
          restore-keys: |
            bazel-disk-xff-md-
      - name: Verify XFF.md and NOTICE match the all-extras binary
        # --config=xff_docs (every extra on), matching both update scripts: the committed artifacts
        # document the whole tool, not just what one build links.
        run: >
          bazel test //xff/cli:xff_markdown_test //xff/cli:xff_notice_test --config=clang
          --config=xff_docs --disk_cache=$HOME/.cache/bazel-disk

  # clang-tidy (hermetic clang-22) over the compile DB. Mirrors mboworks/mbo's job and OWNS clang-tidy
  # in CI: it needs a compile_commands.json this job builds (the pre-commit / trunk jobs skip the
  # local-only hook, which has no compile DB there). Scoped to sources changed against main on a
  # branch; the whole tree on main. The compile DB is extracted in --config=clang-tidy (the develop
  # config: hermetic clang + libc++), so it pulls the hermetic LLVM each run (not cached, like the
  # sanitizer jobs); only a small disk cache of build outputs is persisted.
  # Report-only for now (continue-on-error on the lint STEP): .clang-tidy sets WarningsAsErrors '*'
  # and the test tree is not clang-tidy-clean yet. Building the compile DB still gates (no job-level
  # continue-on-error). Drop the step's continue-on-error to promote this to a hard gate once the
  # remaining (test-file) findings are swept.
  clang-tidy:
    needs: [pre-commit, trunk]
    runs-on: ubuntu-latest
    permissions:
      # actions:write for the cache-cleanup step (`gh cache delete`); the workflow default
      # (read-all) stays in force for every other job.
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so a branch can diff against main to pick changed sources
      - uses: bazelbuild/setup-bazelisk@v3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Select the scope to lint
        # clang-tidy is roughly one translation unit per ~50s, so on a branch lint only the sources
        # changed against main; on main lint the whole tree. Header and build metadata changes trigger a full sweep.
        # findings in the sources that include it, none of which are in the branch's changed set - the
        # post-merge run on main is what catches those.
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "CLANG_TIDY_SCOPE=--all-files" >>"${GITHUB_ENV}"
            git ls-files -- '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' '*.inc' '*.ipp' '*.h.in' '*.bzl' >.clang-tidy-inputs
            echo "Linting the whole tree (on main)."
          else
            git fetch --no-tags --quiet origin main
            WIDE_CHANGES="$(git diff --name-only origin/main...HEAD -- \
              '*.h' '*.hh' '*.hpp' '*.hxx' '*.inc' '*.ipp' '*.h.in' '*.bzl' \
              '.github/workflows/main.yml' '.pre-commit-config.yaml' 'tools/clang_tidy.sh' \
              'tools/clang_tidy_compdb.py' 'tools/clang_tidy_runner.py' 'tools/clang_tidy_scope.py')"
            if [ -n "${WIDE_CHANGES}" ]; then
              echo "CLANG_TIDY_SCOPE=--all-files" >>"${GITHUB_ENV}"
              git ls-files -- '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' '*.inc' '*.ipp' '*.h.in' '*.bzl' >.clang-tidy-inputs
              echo "Linting the whole tree because compilation-wide files changed:"
              echo "${WIDE_CHANGES}" | sed 's/^/  /'
            else
              echo "CLANG_TIDY_SCOPE=--from-ref origin/main --to-ref HEAD" >>"${GITHUB_ENV}"
              git diff --name-only origin/main...HEAD -- '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' '*.inc' '*.ipp' '*.h.in' '*.bzl' >.clang-tidy-inputs
              echo "Linting translation units changed against origin/main:"
              git diff --name-only origin/main...HEAD -- \
                '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' '*.inc' '*.ipp' '*.h.in' '*.bzl' |
                sed 's/^/  /'
            fi
          fi
      - name: Restore the Bazel disk cache
        # SPLIT restore/save on purpose. With a single actions/cache@v4 and a key that only changes
        # when MODULE.bazel.lock / .bazelversion do, the first run saves and every later run is a
        # cache HIT - and a hit never saves, so the cache freezes at that first content and every run
        # recompiles all of xff from scratch. That is why this cell took ~34 min while mboworks/mbo's
        # equivalent ran ~6 min warm. The post-job cleanup retains only the newest entry: if this
        # run saves successfully it supersedes the restored predecessor; if saving fails, that
        # predecessor remains newest and is retained.
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-clang-tidy-${{ hashFiles('MODULE.bazel.lock', '.bazelversion') }}-${{ github.sha }}
          restore-keys: |
            bazel-disk-clang-tidy-${{ hashFiles('MODULE.bazel.lock', '.bazelversion') }}-
            bazel-disk-clang-tidy-
      - name: Route bazel at the disk cache
        # compile_commands-update.sh runs bazel internally (--config=clang-tidy); feed it the disk
        # cache via the try-import'd .bazelrc.user. LLVM re-fetches each run (deliberately not cached).
        # The GC cap keeps a rolling cache from growing without bound: GitHub allows 10 GB per repo
        # across ALL caches, and evicting other jobs' entries would trade this speedup for theirs.
        run: |
          {
            echo "common --disk_cache=$HOME/.cache/bazel-disk"
            echo "common --experimental_disk_cache_gc_max_size=4G"
          } >.bazelrc.user
      - name: Generate compile_commands.json
        # A gitignored local artifact, so build it here. The script extracts the DB in
        # --config=clang-tidy and names the hermetic clang driver, which is what makes the commands
        # parseable by the matching clang-tidy. It also runs `bazel build --config=clang-tidy //...`
        # first (the same config as its aquery) to materialize the generated / virtual-include
        # headers the recorded commands reference - without which clang-tidy would abort on
        # `'xff/license/notice.h' file not found` on a fresh runner.
        run: ./compile_commands-update.sh
      - name: Save the Bazel disk cache
        # Only on main: one rolling entry per main commit (GitHub evicts LRU), while branch runs stay
        # restore-only. Branches therefore get main's warm cache without each PR writing its own copy
        # and churning the 10 GB budget. `if: always()` so a red lint still preserves the compile work.
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-clang-tidy-${{ hashFiles('MODULE.bazel.lock', '.bazelversion') }}-${{ github.sha }}
      - name: Delete the superseded disk caches
        # The per-commit key above ACCUMULATES ~0.35 GB per main commit and nothing deleted them:
        # measured 2026-08-15 they held 9.8 of the 10 GB repo budget, one LRU eviction away from
        # eating the matrix cells' caches. Keep only the newest entry. A second generation is not a
        # useful fallback: prefix restore chooses the newest match and does not retry an older cache
        # after a restore failure. Adopted from mboworks/mbo's cleanup step (theirs is ref-scoped;
        # this key is main-only so the bare prefix is the scope).
        if: always() && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          stale=$(gh cache list --limit 250 --json id,key,createdAt             --jq 'map(select(.key|startswith("bazel-disk-clang-tidy-")))|sort_by(.createdAt)|.[:-1]|.[].id')
          for cache_id in ${stale}; do
            echo "Deleting cache ${cache_id}"
            gh cache delete "${cache_id}" || echo "Could not delete ${cache_id}"
          done
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - name: Summarize the compile DB
        run: |
          set -euo pipefail
          STATS="$(python3 -c '
          import collections, json
          entries = json.load(open("compile_commands.json"))
          files = collections.Counter(e["file"] for e in entries)
          print(len(entries), len(files), sum(n - 1 for n in files.values() if n > 1))
          ')"
          read -r ENTRIES UNIQUE DUPES <<<"${STATS}"
          {
            echo "### clang-tidy compile database"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Entries | ${ENTRIES} |"
            echo "| Unique files | ${UNIQUE} |"
            echo "| Duplicate entries | ${DUPES} |"
            echo "| Lint scope | \`${CLANG_TIDY_SCOPE}\` |"
          } >>"${GITHUB_STEP_SUMMARY}"
      - name: Run clang-tidy with progress
        # Invoke the script directly so parallel per-file progress streams live in CI output.
        run: |
          set -euo pipefail
          mapfile -t FILES <.clang-tidy-inputs
          tools/clang_tidy.sh "${FILES[@]}"

  # Single required status check: one job that gates merge on the whole matrix,
  # so branch protection needs only `done`. A yq/jq step self-checks that every
  # workflow job is wired into `needs`, so a newly added job cannot silently
  # escape the gate. Mirrors mboworks/mbo.
  done:
    # Every declared job must appear here (the step below enforces exactly that).
    needs:
      [
        test,
        pre-commit,
        trunk,
        coverage,
        fuzz,
        gcc,
        tsan,
        msan,
        minimal,
        xff-md,
        clang-tidy,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ensure every job is wired into this gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          declared="$(yq '.jobs | keys | .[]' .github/workflows/main.yml | grep -vx done | sort)"
          wired="$(jq -r 'keys[]' <<<"${NEEDS_JSON}" | sort)"
          missing="$(comm -23 <(printf '%s\n' "${declared}") <(printf '%s\n' "${wired}"))"
          if [[ -n "${missing}" ]]; then
            echo "Jobs declared in the workflow but missing from done.needs:"
            while read -r job; do
              echo "::error title=Gate is missing a job::${job} not in done.needs"
            done <<<"${missing}"
            exit 1
          fi
          echo "done covers all $(grep -c . <<<"${declared}") workflow jobs."
      - name: Fail if any dependency did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
