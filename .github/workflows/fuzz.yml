name: Deep fuzz

on:
  schedule:
    # Weekly sustained mutation without delaying every merge and release.
    - cron: "17 3 * * 0"
  workflow_dispatch: {}

concurrency:
  group: deep-fuzz
  cancel-in-progress: false

permissions: read-all

jobs:
  fuzz:
    permissions:
      contents: read
      actions: write # Retire replaced main cache generations after successful uploads.
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.0
      - name: Restore Bazel compiled outputs
        id: bazel-cache
        uses: ./.github/actions/bazel-cache-restore
        with:
          namespace: fuzz
          legacy-prefix: bazel-disk-fuzz-
      - name: Run deep fuzz campaigns
        env:
          SECONDS_PER_TARGET: 600
        run: |
          set -euo pipefail
          target_count="$(tools/fuzz_targets.py --list | wc -l)"
          {
            echo "### Deep fuzz campaigns"
            echo
            echo "${target_count} targets, ${SECONDS_PER_TARGET} seconds per target"
          } >>"${GITHUB_STEP_SUMMARY}"
          tools/fuzz_targets.py \
            --campaign-seconds="${SECONDS_PER_TARGET}" \
            --max-total-seconds=7200 \
            --disk-cache="${HOME}/.cache/bazel-disk" \
            --jobs="$(getconf _NPROCESSORS_ONLN)" \
            --output-dir="${RUNNER_TEMP}/fuzz-campaigns"
      - name: Preserve fuzz campaign logs and findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-campaigns
          path: ${{ runner.temp }}/fuzz-campaigns/
          retention-days: 7
          if-no-files-found: warn
      - name: Save refreshed Bazel compiled outputs
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.bazel-cache.outcome == 'success' }}
        uses: ./.github/actions/bazel-cache-save
        with:
          key: ${{ steps.bazel-cache.outputs.key }}
