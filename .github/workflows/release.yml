# Release: on a version tag push (e.g. `git tag v0.1.0 && git push origin v0.1.0`,
# or `tools/trigger_release.sh 0.1.0`), build the lean and full binaries for Linux
# and macOS and cut a GitHub release with raw executables, one debug archive per platform, and a
# checksum manifest. The CHANGELOG section and generated installation instructions form the body.
#
# xff is not published to a registry; it ships as a tool. The version is stamped
# from the tag at build time (override-on-release, see tools/release_prep.sh),
# so the repository itself stays at the 0.0.0 sentinel and there are no
# version-bump commits.
#
# The tag is pushed by a maintainer's credentials, so this workflow triggers
# normally (a one-click dispatch that pushed the tag with the default
# GITHUB_TOKEN would NOT, per the "GITHUB_TOKEN does not trigger downstream
# workflows" rule; a PAT-based trigger can be added later if wanted).
name: Release

on:
  push:
    tags:
      # v-prefixed numeric semver only (e.g. v0.1.0). The `v` gives a clean `v*`
      # tag-protection glob; release_prep.sh strips it to the bare stamped version.
      - "v[0-9]+.[0-9]+.[0-9]+"
permissions: read-all

env:
  RELEASE_TAG: ${{ github.ref_name }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Validate release tag
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}" >/dev/null
          [[ "$(git rev-parse HEAD)" == "$(git rev-list -n 1 "${RELEASE_TAG}")" ]]

  coverage:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: bazelbuild/setup-bazelisk@v3
      - name: Mount Bazel coverage disk cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-coverage-${{ hashFiles('MODULE.bazel.lock', '.bazelversion') }}
          restore-keys: |
            bazel-disk-coverage-
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install coverage dependencies
        run: |
          # Ubuntu's lcov package supplies the Perl dependencies, but its old genhtml ignores
          # metric-specific color thresholds. Install the pinned current release over it below.
          sudo apt-get install -y lcov mandoc fuse3 libfuse3-3
          tools/install_lcov.sh "${RUNNER_TEMP}/lcov"
          echo "${RUNNER_TEMP}/lcov/bin" >>"${GITHUB_PATH}"
      - name: Collect release coverage
        # --config=xff_docs includes the aggregate xff_all switch, so extensions added to the
        # registry join release coverage automatically, as well as the complete documented surface.
        # This Linux runner installs fuse3 and opts into the explicit Bazel capability contract, so
        # the integration test must fail rather than skip if mounting stops working.
        run: |
          set -euo pipefail
          tools/release_prep.sh "${RELEASE_TAG}" >/dev/null
          bazel build --config=clang --config=xff_docs //xff/cli:xff_reference_gen
          cp bazel-bin/xff/cli/XFF.md.actual XFF.md
          cp bazel-bin/xff/cli/XFF.html.actual XFF.html
          coverage_page="tag/${RELEASE_TAG#v}"
          instrumentation_filter="$(tools/extras.py --instrumentation-filter)"
          # shellcheck disable=SC2046  # deliberate splitting into Bazel target patterns
          bazel coverage //... $(tools/extras.py --wildcards) \
            --config=clang-coverage \
            --config=xff_docs \
            --config=xff_fuse_tests_required \
            --combined_report=lcov \
            --disk_cache=$HOME/.cache/bazel-disk \
            --instrumentation_filter="${instrumentation_filter}"
          cp "$(bazel info output_path)/_coverage/_coverage_report.dat" coverage.lcov
          printf '%s\n' "${coverage_page}" >coverage-target.txt
          python3 tools/coverage_sources.py coverage.lcov coverage-html.lcov \
            --policy coverage_policy.json \
            --source-root coverage-source-tree
          python3 tools/coverage_lcovrc.py coverage_policy.json coverage.lcovrc
          # LLVM can mark a hit line whose branches remain unevaluated. LCOV 2.5 calls these
          # inconsistent/corrupt; repeating the warning categories suppresses their expected
          # warning summaries.
          genhtml coverage-html.lcov \
            --branch-coverage \
            --config-file coverage.lcovrc \
            --demangle-cpp \
            --function-coverage \
            --ignore-errors corrupt,inconsistent,inconsistent,negative,unsupported,unsupported \
            --output-directory coverage-html/lcov \
            --prefix "${PWD}/coverage-source-tree" \
            --show-details \
            --title "xff ${RELEASE_TAG} production coverage"
          python3 tools/coverage_html.py coverage-html/lcov coverage_policy.json "${coverage_page}"
          python3 -m unittest tools/coverage_test.py tools/coverage_sources_test.py \
            tools/coverage_html_test.py tools/coverage_index_test.py tools/coverage_lcovrc_test.py \
            tools/coverage_policy_test.py
          python3 tools/coverage.py \
            --json-summary coverage-html/coverage-summary.json \
            --lcov coverage.lcov \
            --policy coverage_policy.json \
            --summary coverage-summary.md
          python3 tools/coverage_index.py report \
            coverage-html/coverage-summary.json "${coverage_page}" coverage-html/index.html
          {
            echo "### Production coverage"
            echo
            echo "[Browse the HTML coverage report](https://mboworks.github.io/xff/coverage/${coverage_page}/)."
            echo
            echo "[Download this run's coverage artifact](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}#artifacts)."
            echo
            cat coverage-summary.md
          } >>"${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: |
            coverage-html/
            coverage.lcov
            coverage-summary.md
            coverage-target.txt
            XFF.html
            XFF.md
          retention-days: 14
          if-no-files-found: error

  build:
    needs: validate
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      # If one platform fails, do not publish a half-built release.
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      # bazelisk launches the Bazel release pinned in .bazelversion.
      - uses: bazelbuild/setup-bazelisk@v3
      - name: Mount Bazel caches
        uses: actions/cache@v6
        with:
          path: ~/.cache/bazel-disk
          key: bazel-release-clang-${{ matrix.os }}-${{ hashFiles('MODULE.bazel.lock', '.bazelversion') }}
          restore-keys: |
            bazel-release-clang-${{ matrix.os }}-
            bazel-disk-${{ matrix.os }}-release-
      # Stamp the tag version into MODULE.bazel + main.cc and verify consistency
      # (discard the notes it prints; the release job re-derives them).
      - name: Stamp version + verify
        run: tools/release_prep.sh "${RELEASE_TAG}" >/dev/null
      - name: Build lean + full binaries
        run: |
          command -v zstd
          bazel build --config=release //xff/cli:xff \
            --disk_cache="${HOME}/.cache/bazel-disk" --repository_cache="${HOME}/.cache/bazel-repo"
          bazel build --config=release --config=xff_full //xff/cli:xff_full \
            --disk_cache="${HOME}/.cache/bazel-disk" --repository_cache="${HOME}/.cache/bazel-repo"
      - name: Stage artifacts
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          arch="$(uname -m)"
          lean="$(bazel cquery --config=release --output=files //xff/cli:xff 2>/dev/null)"
          full="$(bazel cquery --config=release --config=xff_full --output=files //xff/cli:xff_full 2>/dev/null)"
          tools/stage_release_artifacts.sh "${PLATFORM}" "${arch}" "${lean}" "${full}" dist
          staged="dist/.xff-${PLATFORM}-${arch}-staging/xff-${PLATFORM}-${arch}"
          "${staged}/xff" --version
          "${staged}/xff" --help >/dev/null
          "${staged}/xff_full" --version
          "${staged}/xff_full" --help >/dev/null
          ls -lh dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: xff-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [build, coverage]
    runs-on: ubuntu-latest
    permissions:
      # Creating a release writes to the repo's releases.
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v8
        with:
          pattern: xff-*
          path: dist
          merge-multiple: true
      - name: Generate checksum manifest
        working-directory: dist
        run: |
          sha256sum \
            xff-linux-x86_64 \
            xff_full-linux-x86_64 \
            xff-linux-x86_64.tar.zst \
            xff-macos-arm64 \
            xff_full-macos-arm64 \
            xff-macos-arm64.tar.zst \
            > SHA256SUMS
      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      # release_prep.sh prints the CHANGELOG section and stable release-resource links to stdout
      # (the stamp it also does here is a harmless no-op; nothing is built in this job).
      - name: Generate release notes
        run: tools/release_prep.sh "${RELEASE_TAG}" > release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${RELEASE_TAG}"
          --title "${RELEASE_TAG}"
          --notes-file release-notes.md
          --verify-tag
          dist/*
