name: Benchmarks

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            cpus: 3
            timeout: 45
          - os: macos-latest
            platform: macos
            cpus: 3
            timeout: 90
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@0.19.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check runner CPU capacity
        run: |
          affinity=()
          if [[ "${RUNNER_OS}" == Linux ]]; then
            affinity=(--require-cpu-affinity)
          fi
          python3 tools/benchmark_compare.py --check-runner --cpus=1 --cpus=${{ matrix.cpus }} "${affinity[@]}"
      # Restore the existing release-build cache; do not add another cache generation or quota.
      - uses: ./.github/actions/bazel-cache-restore
        with:
          namespace: default
      - name: Identify measurement platform
        run: echo "BENCHMARK_PLATFORM=${{ matrix.platform }}-$(uname -m)" >>"${GITHUB_ENV}"
      - name: Build paired optimized revisions
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          base_sha="$(git rev-parse HEAD^1)"
          git worktree add --detach "${RUNNER_TEMP}/benchmark-base" "${base_sha}"
          bazel build //xff/cli:xff //xff/engine:read_benchmark //tools:benchmark_resources //xff/engine:expression_benchmark //xff/engine:expression_run_benchmark --config=clang_release \
            --disk_cache="${HOME}/.cache/bazel-disk"
          cp bazel-bin/xff/cli/xff "${RUNNER_TEMP}/benchmark-head"
          cp bazel-bin/xff/engine/read_benchmark "${RUNNER_TEMP}/benchmark-head-reads"
          launcher="$(bazel cquery //tools:process_resources_native --config=clang_release \
            --output=starlark --starlark:expr='target.files_to_run.executable.path')"
          cp "${launcher}" "${RUNNER_TEMP}/benchmark-resource-launcher"
          driver="$(pwd)/$(bazel cquery //tools:benchmark_resources --config=clang_release \
            --output=starlark --starlark:expr='target.files_to_run.executable.path')"
          (
            cd "${RUNNER_TEMP}/benchmark-base"
            bazel build //xff/cli:xff //xff/engine:read_benchmark --config=clang_release --disk_cache="${HOME}/.cache/bazel-disk"
            cp bazel-bin/xff/cli/xff "${RUNNER_TEMP}/benchmark-base-bin"
            cp bazel-bin/xff/engine/read_benchmark "${RUNNER_TEMP}/benchmark-base-reads"
          )
          {
            echo "BENCHMARK_HEAD=${head_sha}"
            echo "BENCHMARK_BASE=${base_sha}"
            echo "BENCHMARK_DRIVER=${driver}"
          } >>"${GITHUB_ENV}"
      - name: Measure expression preparation and execution baseline
        run: |
          bazel run //xff/engine:expression_benchmark --config=clang_release --disk_cache="${HOME}/.cache/bazel-disk" -- \
            --benchmark_out="${GITHUB_WORKSPACE}/expression-baseline-${{ matrix.platform }}.json" \
            --benchmark_out_format=json --benchmark_display_aggregates_only=true \
            --benchmark_enable_random_interleaving=true \
            --benchmark_context="revision=$(git rev-parse HEAD),sampling=random-interleaved-9-fastest-7"
          python3 - <<'PY_CHECK'
          import json
          import os
          from pathlib import Path
          report = Path(os.environ["GITHUB_WORKSPACE"]) / "expression-baseline-${{ matrix.platform }}.json"
          rows = json.loads(report.read_text())["benchmarks"]
          if not rows or any(row.get("error_occurred") for row in rows):
              raise SystemExit("expression baseline failed correctness validation")
          PY_CHECK
      - name: Measure whole-engine expression integration
        run: |
          bazel run //xff/engine:expression_run_benchmark --config=clang_release --disk_cache="${HOME}/.cache/bazel-disk" -- \
            --benchmark_out="${GITHUB_WORKSPACE}/expression-engine-${{ matrix.platform }}.json" \
            --benchmark_out_format=json --benchmark_display_aggregates_only=true \
            --benchmark_enable_random_interleaving=true \
            --benchmark_context="revision=$(git rev-parse HEAD),sampling=random-interleaved-9-fastest-7"
          python3 - <<'PY_CHECK'
          import json
          import os
          from pathlib import Path
          report = Path(os.environ["GITHUB_WORKSPACE"]) / "expression-engine-${{ matrix.platform }}.json"
          rows = json.loads(report.read_text())["benchmarks"]
          if not rows or any(row.get("error_occurred") for row in rows):
              raise SystemExit("whole-engine expression benchmark failed correctness validation")
          PY_CHECK
      - uses: actions/upload-artifact@v7
        with:
          name: expression-baseline-${{ matrix.platform }}
          path: |
            expression-baseline-${{ matrix.platform }}.json
            expression-engine-${{ matrix.platform }}.json
          retention-days: 30
          if-no-files-found: error
      - name: Measure alternating base and head workloads
        run: |
          set -euo pipefail
          python3 tools/benchmark_history.py measure \
            --driver="${BENCHMARK_DRIVER}" \
            --head-read-counter="${RUNNER_TEMP}/benchmark-head-reads" \
            --base-read-counter="${RUNNER_TEMP}/benchmark-base-reads" \
            --head-binary="${RUNNER_TEMP}/benchmark-head" \
            --base-binary="${RUNNER_TEMP}/benchmark-base-bin" \
            --head="${BENCHMARK_HEAD}" --base="${BENCHMARK_BASE}" \
            --base-build-identity="$(cat "${RUNNER_TEMP}/benchmark-base/.bazelrc" "${RUNNER_TEMP}/benchmark-base/bazelmod/llvm.MODULE.bazel" | shasum -a 256 | cut -d ' ' -f 1)" \
            --head-build-identity="$(cat .bazelrc bazelmod/llvm.MODULE.bazel | shasum -a 256 | cut -d ' ' -f 1)" \
            --build='bazel --config=clang_release //xff/cli:xff' \
            --runner-class='github-hosted ${{ matrix.os }}' \
            --tools="$(bazel --version); module-lock=$(shasum -a 256 MODULE.bazel.lock); base-module-lock=$(shasum -a 256 "${RUNNER_TEMP}/benchmark-base/MODULE.bazel.lock")" \
            --platform=${{ matrix.platform }} --output=benchmark-report-${BENCHMARK_PLATFORM}.json
      - name: Plan equal sample shards and stage shared binaries
        run: |
          scales=()
          for count in 10 20 50 100 200 500 1000 2000 5000 10000 20000 50000 100000; do
            scales+=(--files="${count}")
          done
          python3 tools/benchmark_shards.py --plan --adaptive --count=5 "${scales[@]}" \
            --partition=samples --repetitions=15 --keep=15 \
            --cpus=1 --cpus=${{ matrix.cpus }} --output=benchmark-plan.json
          tar -cf benchmark-build.tar -C "${RUNNER_TEMP}" benchmark-head benchmark-resource-launcher
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-build-${{ matrix.platform }}
          path: |
            benchmark-build.tar
            benchmark-plan.json
            benchmark-report-${{ env.BENCHMARK_PLATFORM }}.json
          retention-days: 3
          if-no-files-found: error

  measure:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
        platform: [linux, macos]
        include:
          - platform: linux
            os: ubuntu-latest
            cpus: 3
            timeout: 60
          - platform: macos
            os: macos-latest
            cpus: 3
            timeout: 90
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/benchmark-measure
        with:
          platform: ${{ matrix.platform }}
          runner: ${{ matrix.os }}
          shard: ${{ matrix.shard }}
          head: ${{ github.sha }}

  select-initial:
    name: Check initial benchmark agreement
    needs: [build, measure]
    if: always() && needs.build.result == 'success' && needs.measure.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      linux_fourth: ${{ steps.decision.outputs.linux_fourth }}
      macos_fourth: ${{ steps.decision.outputs.macos_fourth }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          pattern: benchmark-shard-*
          path: candidate-shards
          if-no-artifact-found: ignore
      - name: Schedule a fourth candidate only for unresolved platforms
        id: decision
        run: |
          mkdir -p candidate-shards
          python3 tools/benchmark_shards.py --decide-adaptive=candidate-shards \
            --decision-stage=initial >>"${GITHUB_OUTPUT}"

  measure-fourth-linux:
    name: Benchmark measurement (linux, shard 3)
    needs: select-initial
    if: needs.select-initial.outputs.linux_fourth == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/benchmark-measure
        with:
          platform: linux
          runner: ubuntu-latest
          shard: 3
          head: ${{ github.sha }}

  measure-fourth-macos:
    name: Benchmark measurement (macos, shard 3)
    needs: select-initial
    if: needs.select-initial.outputs.macos_fourth == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/benchmark-measure
        with:
          platform: macos
          runner: macos-latest
          shard: 3
          head: ${{ github.sha }}

  select-fourth:
    name: Check benchmark agreement after fourth candidates
    needs: [select-initial, measure-fourth-linux, measure-fourth-macos]
    if: always() && needs.select-initial.result == 'success' &&
      needs.measure-fourth-linux.result != 'failure' && needs.measure-fourth-macos.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      linux_fifth: ${{ steps.decision.outputs.linux_fifth }}
      macos_fifth: ${{ steps.decision.outputs.macos_fifth }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          pattern: benchmark-shard-*
          path: candidate-shards
          if-no-artifact-found: ignore
      - name: Schedule a fifth candidate only without a three-shard majority
        id: decision
        run: |
          mkdir -p candidate-shards
          python3 tools/benchmark_shards.py --decide-adaptive=candidate-shards \
            --decision-stage=fourth >>"${GITHUB_OUTPUT}"

  measure-fifth-linux:
    name: Benchmark measurement (linux, shard 4)
    needs: select-fourth
    if: needs.select-fourth.outputs.linux_fifth == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/benchmark-measure
        with:
          platform: linux
          runner: ubuntu-latest
          shard: 4
          head: ${{ github.sha }}

  measure-fifth-macos:
    name: Benchmark measurement (macos, shard 4)
    needs: select-fourth
    if: needs.select-fourth.outputs.macos_fifth == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/benchmark-measure
        with:
          platform: macos
          runner: macos-latest
          shard: 4
          head: ${{ github.sha }}

  aggregate:
    needs:
      [
        build,
        measure,
        select-initial,
        measure-fourth-linux,
        measure-fourth-macos,
        select-fourth,
        measure-fifth-linux,
        measure-fifth-macos,
      ]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: coverage-pages
          path: benchmark-baseline
          sparse-checkout: benchmarks/runs
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          pattern: benchmark-shard-*
          path: candidate-shards
      - uses: actions/download-artifact@v8
        with:
          pattern: benchmark-build-*
          path: build-metadata
      - name: Select agreed candidates and render both platforms
        id: reports
        run: |
          set -euo pipefail
          git rev-list --first-parent HEAD^1 > benchmark-baseline-revisions.txt
          python3 tools/benchmark_shards.py --merge-adaptive-directory=candidate-shards \
            --output-directory=merged --seed-directory=build-metadata \
            --baseline-root=benchmark-baseline/benchmarks --baseline-revisions=benchmark-baseline-revisions.txt
          for platform in linux macos; do
            arch="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tool_comparisons"]["contract"]["machine"])' "merged/benchmark-merged-${platform}.json")"
            report="benchmark-report-${platform}-${arch}"
            mv "merged/benchmark-merged-${platform}.json" "${report}.json"
            python3 tools/benchmark_provenance.py --report="${report}.json" --embed \
              --archive="build-metadata/benchmark-build-${platform}/benchmark-build.tar" \
              --retention-reference="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }} (benchmark-build-${platform})"
            python3 tools/benchmark_compare.py --render-only --report="${report}.json" \
              --html="${report}.html" --summary="${report}.md"
            cat "${report}.md" >>"${GITHUB_STEP_SUMMARY}"
            echo "${platform}_arch=${arch}" >>"${GITHUB_OUTPUT}"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-report-linux-${{ steps.reports.outputs.linux_arch }}
          path: |
            benchmark-report-linux-*
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-report-macos-${{ steps.reports.outputs.macos_arch }}
          path: |
            benchmark-report-macos-*
          retention-days: 30
          if-no-files-found: error
