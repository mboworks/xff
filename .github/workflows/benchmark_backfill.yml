name: Benchmark backfill

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: benchmark-backfill
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: coverage-pages
          path: benchmark-history
          sparse-checkout: benchmarks/runs
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Freeze the historical revision selection
        id: plan
        run: |
          set -euo pipefail
          matrix="$(python3 tools/benchmark_campaign.py plan --repo=. \
            --history-root=benchmark-history/benchmarks --output=campaign.json)"
          echo "matrix=${matrix}" >>"${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-backfill-plan
          path: campaign.json
          overwrite: true
          if-no-files-found: error
          retention-days: 30

  backfill:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: Replay ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: benchmark-backfill-plan
          path: campaign
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: bazel-contrib/setup-bazel@0.19.0
      - name: Check runner capacity
        run: |
          affinity=()
          if [[ "${RUNNER_OS}" == Linux ]]; then
            affinity=(--require-cpu-affinity)
          fi
          python3 tools/benchmark_compare.py --check-runner --cpus=1 --cpus=3 "${affinity[@]}"
      - uses: ./.github/actions/bazel-cache-restore
        with:
          namespace: default
      - name: Install reference tools for this revision
        run: |
          if [[ "${RUNNER_OS}" == Linux ]]; then
            sudo apt-get update && sudo apt-get install -y findutils ripgrep fzf
          else
            brew install findutils ripgrep fzf
          fi
      - name: Build and measure the complete revision on this host
        timeout-minutes: 165
        run: |
          set -euo pipefail
          fixture_parent="${RUNNER_TEMP}"
          if [[ "${RUNNER_OS}" == Linux ]]; then
            fixture_parent=/dev/shm
          fi
          python3 tools/benchmark_campaign.py run --repo="${GITHUB_WORKSPACE}" \
            --plan=campaign/campaign.json --job="${{ matrix.id }}" \
            --output="${RUNNER_TEMP}/backfill" --fixture-parent="${fixture_parent}" \
            --disk-cache="${HOME}/.cache/bazel-disk"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-backfill-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/backfill/batch.json
            ${{ runner.temp }}/backfill/status.json
            ${{ runner.temp }}/backfill/index.html
            ${{ runner.temp }}/backfill/reports
            ${{ runner.temp }}/backfill/binaries/*/build.log
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
